global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'ml-pipeline-monitor'
  routes:
    - match:
        severity: critical
      receiver: 'ml-pipeline-monitor'
      continue: true
    - match:
        severity: warning
      receiver: 'ml-pipeline-monitor'

receivers:
  - name: 'ml-pipeline-monitor'
    webhook_configs:
      - url: 'http://api:8000/v1/alerts/webhook'
        send_resolved: true
        # `timeout` is not a field of http_config; including it made
        # Alertmanager reject this file outright and refuse to start.
        max_alerts: 0

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
