global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ml-pipeline-monitor'
    environment: 'production'

# Alertmanager receives every firing rule below. The alertmanager service is
# behind the "monitoring" compose profile; when it is not running Prometheus
# simply retries delivery, so leaving this enabled is safe either way.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ML Pipeline Monitor API
  - job_name: 'ml-pipeline-monitor-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
    scrape_interval: 10s
    scrape_timeout: 5s

  # ML Pipeline Monitor Streamlit app
  - job_name: 'ml-pipeline-monitor-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8502']
    scrape_interval: 30s
    scrape_timeout: 5s

  # Node Exporter for host-level metrics (optional - run on host)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['host.docker.internal:9100']

  # cAdvisor for container metrics (optional)
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
