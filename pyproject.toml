[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-pipeline-monitor"
version = "1.0.0"
description = "Production-grade MLOps observability platform built with Streamlit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Aryan41211"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core ML / Data Science
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "scipy>=1.13.0,<2.0.0",
    # Pinned <2.1.0: 2.1+ pulls the NVIDIA CUDA runtime as a hard dependency,
    # adding ~2GB to the image. Keep in sync with requirements.txt.
    "xgboost>=2.0.0,<2.1.0",
    "joblib>=1.3.0,<2.0.0",
    # Web Framework
    "streamlit>=1.35.0,<2.0.0",
    # Floor raised with the starlette bump: FastAPI <0.141 pins starlette to a
    # range that excludes the patched releases.
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn>=0.29.0,<1.0.0",
    # starlette <1.0 carried 7 known CVEs with no fix in range; 1.3.1 is the
    # first patched release and streamlit caps the upper bound at <1.4.0.
    "starlette>=1.3.1,<1.4.0",
    "pydantic>=2.6.0,<3.0.0",
    "slowapi>=0.1.8,<1.0.0",
    # Visualization
    "plotly>=5.18.0,<7.0.0",
    "altair>=5.3.0,<7.0.0",
    "pillow>=10.0.0,<13.0.0",
    "pyarrow>=14.0.0,<24.0.0",
    "pydeck>=0.9.0,<1.0.0",
    # Database
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg-pool>=3.2.0,<4.0.0",
    # Auth / Security
    "bcrypt>=4.0.0,<6.0.0",
    # Config / Serialization
    "pyyaml>=6.0.0,<7.0.0",
    # Monitoring
    "prometheus-client>=0.20.0,<1.0.0",
    "psutil>=5.9.0,<8.0.0",
    # HTTP
    "httpx>=0.27.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "certifi>=2024.0.0",
    "urllib3>=2.0.0,<3.0.0",
    # Async / Networking
    "anyio>=4.0.0,<5.0.0",
    # Limits (slowapi dependency)
    "limits>=3.0.0,<6.0.0",
    # Tornado (Streamlit dependency, pinned for stability)
    "tornado>=6.4.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-playwright>=0.5.0,<1.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-html>=4.1.0,<5.0.0",
    "coverage>=7.4.0,<8.0.0",
    "ruff>=0.4.0,<1.0.0",
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pre-commit>=3.7.0,<5.0.0",
    "types-requests>=2.31.0,<3.0.0",
    "types-PyYAML>=6.0.12,<7.0.0",
    "types-python-dateutil>=2.8.19,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "safety>=3.2.0,<4.0.0",
    "locust>=2.20.0,<3.0.0",
]
worker = [
    "celery>=5.3.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    "flower>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
]

[project.scripts]
mlmonitor-api = "ml_pipeline_monitor.api.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

# pytest configuration lives in pytest.ini and coverage settings in .coveragerc;
# both took precedence over duplicates here, so the copies only ever drifted.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

# Rules suppressed below are cases where the flagged form is the correct one.
# Nothing here is silenced merely to make the build pass.
[tool.ruff.lint.per-file-ignores]
# N803/N806: X, X_train, X_test are the conventional names for feature matrices
# across scikit-learn and the wider ML ecosystem. Renaming them to x_train
# would make this code harder to read, not easier.
"src/ml_pipeline_monitor/ml/*.py" = ["N803", "N806"]
"src/ml_pipeline_monitor/services/*.py" = ["N803", "N806"]
"src/ml_pipeline_monitor/database/*.py" = ["N803", "N806"]
# SIM117: stacked `with patch(...)` blocks read better one mock per line than
# collapsed into a single multi-context statement.
"tests/**/*.py" = ["N803", "N806", "SIM117"]
# B008: `Depends(...)` / `Security(...)` in a parameter default is FastAPI's
# required dependency-injection idiom, not an accidental shared mutable.
"src/ml_pipeline_monitor/api/main.py" = ["B008"]
# E501: this module is a design system built from inline CSS and HTML string
# literals, which black cannot wrap and splitting by hand would obscure.
"src/ml_pipeline_monitor/utils/ui_theme.py" = ["E501"]
# N818: DataQualityFailed is an exported name used by callers; the "Error"
# suffix convention is not worth a breaking rename.
"src/ml_pipeline_monitor/ml/data_validation.py" = ["N803", "N806", "N818"]
# Streamlit pages embed single-line HTML blocks for headers and cards.
"pages/*.py" = ["E501"]
"app.py" = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
# B101 (assert) is not meaningful outside tests; B104 is the intentional
# 0.0.0.0 bind of the containerised metrics exporter.
skips = ["B101"]
