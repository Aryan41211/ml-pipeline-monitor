[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-pipeline-monitor"
version = "1.0.0"
description = "Production-grade MLOps observability platform built with Streamlit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Aryan41211"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core ML / Data Science
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "scipy>=1.13.0,<2.0.0",
    "xgboost>=2.0.0,<4.0.0",
    "joblib>=1.3.0,<2.0.0",
    # Web Framework
    "streamlit>=1.35.0,<2.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.29.0,<1.0.0",
    "starlette>=0.36.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "slowapi>=0.1.8,<1.0.0",
    # Visualization
    "plotly>=5.18.0,<7.0.0",
    "altair>=5.3.0,<7.0.0",
    "pillow>=10.0.0,<13.0.0",
    "pyarrow>=14.0.0,<24.0.0",
    "pydeck>=0.9.0,<1.0.0",
    # Database
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg-pool>=3.2.0,<4.0.0",
    # Auth / Security
    "bcrypt>=4.0.0,<6.0.0",
    # Config / Serialization
    "pyyaml>=6.0.0,<7.0.0",
    # Monitoring
    "prometheus-client>=0.20.0,<1.0.0",
    "psutil>=5.9.0,<8.0.0",
    # HTTP
    "httpx>=0.27.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "certifi>=2024.0.0",
    "urllib3>=2.0.0,<3.0.0",
    # Async / Networking
    "anyio>=4.0.0,<5.0.0",
    # Limits (slowapi dependency)
    "limits>=3.0.0,<6.0.0",
    # Tornado (Streamlit dependency, pinned for stability)
    "tornado>=6.4.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-playwright>=0.5.0,<1.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-html>=4.1.0,<5.0.0",
    "coverage>=7.4.0,<8.0.0",
    "ruff>=0.4.0,<1.0.0",
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pre-commit>=3.7.0,<5.0.0",
    "types-requests>=2.31.0,<3.0.0",
    "types-PyYAML>=6.0.12,<7.0.0",
    "types-python-dateutil>=2.8.19,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "safety>=3.2.0,<4.0.0",
    "locust>=2.20.0,<3.0.0",
]
worker = [
    "celery>=5.3.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    "flower>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
]

[project.scripts]
mlmonitor-api = "ml_pipeline_monitor.api.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=ml_pipeline_monitor",
    "--cov-config=.coveragerc",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
    "--ignore=tests/load",
]

[tool.coverage.run]
source = ["src/ml_pipeline_monitor"]
omit = [
    "*/tests/*",
    "*/test_*",
    "src/ml_pipeline_monitor/core/auth.py",
    "src/ml_pipeline_monitor/utils/ui_theme.py",
    "src/ml_pipeline_monitor/services/worker.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
